[project]
name = "gestiona-backend"
version = "0.1.0"
description = "Gestiona - API de gestión de proyectos (Django + Ninja)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "boto3>=1.44.7",
    "celery[redis]>=5.7.0",
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1,<6.2",
    "django-allauth[headless,socialaccount]>=65.22.1",
    "django-environ>=0.14.0",
    "django-ninja>=1.8.0",
    "django-storages>=1.14.6",
    "gunicorn>=27.0.1",
    "lark>=1.3.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "-q --reuse-db"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]
ignore = ["DJ008", "SIM105", "SIM102"]
